<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontak — Kelurahan Lahendong</title>
  <meta name="description" content="Alamat, jam layanan, dan kontak penting Kelurahan Lahendong, Tomohon Selatan." />
  <link rel="icon" href="img/emblem.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=a37ee1a8" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-[var(--bg)] text-[var(--ink)] min-h-screen flex flex-col">

  <div id="header"></div>

  <main id="konten-utama" class="flex-1">

    <section class="kop-halaman">
      <div class="wadah kop-isi">
        <nav class="remah" aria-label="Lokasi halaman" data-remah></nav>
        <h1 class="judul-halaman">Kontak</h1>
        <p class="kop-ringkas">Nomor darurat, aparat kelurahan, dan layanan umum di Lahendong, beserta informasi Kantor Kelurahan.</p>
      </div>
    </section>

    <section class="wadah seksi">
      <div class="grid lg:grid-cols-12 gap-10 lg:gap-16">

        <!-- 01 · KANTOR — tab profil (alamat_kantor, jam_layanan, telepon_kantor, email).
             Baris yang nilainya kosong di sheet disembunyikan otomatis oleh ui.js. -->
        <div class="reveal lg:col-span-4">
          <span class="eyebrow">Kantor Kelurahan</span>
          <h2 class="judul-seksi mt-4 mb-8">Kunjungi kami</h2>

          <div class="border-t border-[var(--line)]">
            <div class="py-5 border-b border-[var(--line)] flex gap-4" data-wadah-profil>
              <i data-lucide="map-pin" class="w-[18px] h-[18px] text-[var(--primary)] shrink-0 mt-1"></i>
              <div>
                <p class="label-kecil">Alamat</p>
                <p class="text-[15px] mt-1 leading-[1.6]" data-profil="alamat_kantor"></p>
                <a href="https://maps.google.com/?q=Kelurahan+Lahendong+Tomohon" target="_blank" rel="noopener noreferrer"
                   class="inline-flex items-center gap-2 text-sm text-[var(--primary)] font-semibold hover:underline mt-2.5">
                  <i data-lucide="map" class="w-4 h-4"></i> Buka di Google Maps
                </a>
              </div>
            </div>
            <div class="py-5 border-b border-[var(--line)] flex gap-4" data-wadah-profil>
              <i data-lucide="clock" class="w-[18px] h-[18px] text-[var(--primary)] shrink-0 mt-1"></i>
              <div>
                <p class="label-kecil">Jam layanan</p>
                <p class="text-[15px] mt-1" data-profil="jam_layanan"></p>
              </div>
            </div>
            <div class="py-5 border-b border-[var(--line)] flex gap-4" data-wadah-profil>
              <i data-lucide="phone" class="w-[18px] h-[18px] text-[var(--primary)] shrink-0 mt-1"></i>
              <div>
                <p class="label-kecil">Telepon kantor</p>
                <a class="text-[15px] mt-1 inline-block text-[var(--primary)] font-semibold hover:underline"
                   data-profil="telepon_kantor" data-profil-tautan="tel"></a>
              </div>
            </div>
            <div class="py-5 border-b border-[var(--line)] flex gap-4" data-wadah-profil>
              <i data-lucide="mail" class="w-[18px] h-[18px] text-[var(--primary)] shrink-0 mt-1"></i>
              <div class="min-w-0">
                <p class="label-kecil">Email</p>
                <a class="text-[15px] mt-1 inline-block text-[var(--primary)] font-semibold hover:underline break-all"
                   data-profil="email" data-profil-tautan="mailto"></a>
              </div>
            </div>
          </div>
        </div>

        <!-- 02 · NARAHUBUNG — tab kontak (darurat & umum) + tab aparat (yang nomornya diisi) -->
        <div class="reveal lg:col-span-8">
          <span class="eyebrow">Narahubung</span>
          <h2 class="judul-seksi mt-4 mb-8">Kontak penting</h2>
          <div id="daftar-narahubung" class="space-y-10"><!-- diisi oleh JS --></div>
        </div>
      </div>
    </section>

  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js?v=2247cfe5"></script>
  <script src="assets/js/data-contoh.js?v=15a23b69"></script>
  <script src="assets/js/ui.js?v=c906c268"></script>
  <script src="assets/js/komponen.js?v=0605d30a"></script>
  <script src="assets/js/halaman/kontak.js?v=452caf40"></script>
</body>
</html>
