<html lang="id">
<head>

    (function () {
      var halaman = location.pathname.replace(/^\/web-lahendong\/?/, "");
      location.replace("https://kelurahan-lahendong.github.io/" + halaman + location.search + location.hash);
    })();

  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #EEF3F0; color: #10201C;

  </style>
</head>
<body>
