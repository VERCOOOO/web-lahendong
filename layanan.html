<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layanan — Kelurahan Lahendong</title>
  <meta name="description" content="Prosedur, syarat, dan estimasi waktu pengurusan surat di Kantor Kelurahan Lahendong." />
  <link rel="icon" href="img/emblem.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-[var(--bg)] text-[var(--ink)] min-h-screen flex flex-col">

  <div id="header"></div>

  <main id="konten-utama" class="flex-1">

    <section class="kop-halaman bg-[var(--surface)] border-b border-[var(--line)]">
      <div class="wadah py-12 md:py-16 grid md:grid-cols-12 gap-6">
        <div class="md:col-span-7">
          <nav class="remah" aria-label="Lokasi halaman" data-remah></nav>
          <h1 class="judul-halaman mt-4">Layanan Surat</h1>
        </div>
        <div class="md:col-span-5 md:self-end">
          <p class="text-[var(--muted)] leading-[1.65]">
            Syarat, alur, estimasi waktu, dan biaya pengurusan berbagai jenis surat keterangan
            di Kantor Kelurahan Lahendong.
          </p>
        </div>
      </div>
    </section>

    <section class="wadah seksi">
      <div class="grid md:grid-cols-12 gap-8 md:gap-12">
        <div class="reveal md:col-span-4">
          <p class="no-seksi mb-3">01</p>
          <span class="eyebrow">Jenis Surat</span>
          <h2 class="judul-seksi mt-4">Pilih layanan</h2>
          <p class="text-[var(--muted)] mt-4 text-[15px] leading-[1.65]">
            Ketuk salah satu jenis surat untuk melihat syarat dan alur pengurusannya.
          </p>

          <div class="kartu p-5 mt-8 bg-[var(--surface)]">
            <div data-wadah-profil>
              <p class="label-kecil mb-2">Jam layanan</p>
              <p class="text-[15px]" data-profil="jam_layanan"></p>
            </div>
            <a href="kontak.html" class="tautan mt-4">
              <span class="relative">Hubungi kantor<span class="garis absolute left-0 -bottom-0.5"></span></span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </a>
          </div>
        </div>

        <div id="daftar-layanan" class="md:col-span-8 space-y-3">
          <!-- diisi oleh JS -->
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/data-contoh.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/komponen.js"></script>
  <script src="assets/js/halaman/layanan.js"></script>
</body>
</html>
