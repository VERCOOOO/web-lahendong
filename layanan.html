<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layanan — Kelurahan Lahendong</title>
  <meta name="description" content="Prosedur, syarat, dan estimasi waktu pengurusan surat di Kantor Kelurahan Lahendong." />
  <link rel="icon" href="img/emblem.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=682aa9cb" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-[var(--bg)] text-[var(--ink)] min-h-screen flex flex-col">

  <div id="header"></div>

  <main id="konten-utama" class="flex-1">

    <section class="kop-halaman">
      <div class="wadah kop-isi">
        <nav class="remah" aria-label="Lokasi halaman" data-remah></nav>
        <h1 class="judul-halaman">Layanan Surat</h1>
        <p class="kop-ringkas">Syarat, alur, estimasi waktu, dan biaya pengurusan berbagai jenis surat keterangan di Kantor Kelurahan Lahendong.</p>
      </div>
    </section>

    <!-- DAFTAR SURAT — tab layanan; satu baris per surat, kolom kategori opsional -->
    <section class="wadah seksi">
      <div class="grid lg:grid-cols-12 gap-10 lg:gap-14">
        <aside class="lg:col-span-4">
          <div class="panel-layanan">
            <span class="eyebrow">Jenis Surat</span>
            <h2 class="judul-seksi mt-4">Pilih layanan</h2>
            <p class="text-[var(--muted)] mt-4 text-[15px] leading-[1.65]">
              <span id="jumlah-surat" class="font-semibold text-[var(--ink)]"></span>
              Ketuk satu surat untuk melihat syarat dan alur pengurusannya.
            </p>

            <div class="mt-6" data-wadah-cari hidden>
              <label for="cari-surat" class="label-kecil">Cari surat</label>
              <div class="kotak-cari mt-2">
                <i data-lucide="search" class="w-4 h-4"></i>
                <input id="cari-surat" type="search" placeholder="mis. SKTM, usaha, nikah" autocomplete="off" />
              </div>
            </div>

            <div id="filter-kategori" class="flex flex-wrap gap-2 mt-5" aria-label="Saring menurut kategori" hidden></div>

            <div class="kartu p-5 mt-8" data-wadah-profil>
              <p class="label-kecil mb-2">Jam layanan kantor</p>
              <p class="text-[15px]" data-profil="jam_layanan"></p>
              <a href="kontak.html" class="tautan mt-4">
                <span class="relative">Hubungi kantor<span class="garis absolute left-0 -bottom-0.5"></span></span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </a>
            </div>
          </div>
        </aside>

        <div id="daftar-layanan" class="lg:col-span-8 grid gap-10"><!-- diisi oleh JS --></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js?v=2247cfe5"></script>
  <script src="assets/js/data-contoh.js?v=15a23b69"></script>
  <script src="assets/js/ui.js?v=c906c268"></script>
  <script src="assets/js/komponen.js?v=0605d30a"></script>
  <script src="assets/js/halaman/layanan.js?v=9c048369"></script>
</body>
</html>
