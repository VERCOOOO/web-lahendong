<!doctype html>
<html lang="id">
<head>

  <link rel="icon" href="img/emblem.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<body class="bg-[var(--bg)] text-[var(--ink)] min-h-screen flex flex-col">

  <div id="header"></div>

  <main id="konten-utama" class="flex-1">

    <section class="kop-halaman bg-[var(--surface)] border-b border-[var(--line)]">
      <div class="wadah py-12 md:py-16 grid md:grid-cols-12 gap-6">
        <div class="md:col-span-7">
          <nav class="remah" aria-label="Lokasi halaman" data-remah></nav>
          <h1 class="judul-halaman mt-4">Destinasi Wisata</h1>
        </div>
        <div class="md:col-span-5 md:self-end">
          <p class="text-[var(--muted)] leading-[1.65]">
            Dari danau vulkanik tiga warna hingga pemandian air panas alami, berikut destinasi
            yang bisa dikunjungi di sekitar Kelurahan Lahendong.
          </p>
        </div>
      </div>
    </section>

    <section class="wadah seksi">
      <div id="grid-wisata" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5 md:gap-6">
        <!-- diisi oleh JS -->
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/data-contoh.js"></script>
  <script src="assets/js/ui.js"></script>
