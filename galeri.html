<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri — Kelurahan Lahendong</title>
  <meta name="description" content="Galeri foto destinasi wisata dan UMKM Kelurahan Lahendong." />
  <link rel="icon" href="img/emblem.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-[var(--bg)] text-[var(--ink)] min-h-screen flex flex-col">

  <div id="header"></div>

  <main id="konten-utama" class="flex-1">

    <section class="kop-halaman">
      <div class="wadah kop-isi">
        <nav class="remah" aria-label="Lokasi halaman" data-remah></nav>
        <h1 class="judul-halaman">Galeri</h1>
        <p class="kop-ringkas">Kumpulan foto destinasi wisata dan usaha mikro warga Kelurahan Lahendong.</p>
      </div>
    </section>

    <section class="wadah py-12 md:py-20">
      <div class="reveal flex flex-wrap items-center gap-2.5 mb-10 pb-6 border-b border-[var(--line)]">
        <span class="label-kecil mr-2">Saring</span>
        <button data-filter="semua" aria-pressed="true" class="tombol-filter">Semua</button>
        <button data-filter="wisata" aria-pressed="false" class="tombol-filter">Wisata</button>
        <button data-filter="umkm" aria-pressed="false" class="tombol-filter">UMKM</button>
        <span id="jumlah-foto" class="text-sm text-[var(--muted)] ml-auto"></span>
      </div>

      <div id="grid-galeri" class="grid-adaptif" data-maks="4">
        <!-- diisi oleh JS -->
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/data-contoh.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/komponen.js"></script>
  <script src="assets/js/halaman/galeri.js"></script>
</body>
</html>
