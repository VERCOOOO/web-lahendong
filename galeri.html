<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri — Kelurahan Lahendong</title>
  <meta name="description" content="Galeri foto destinasi wisata dan UMKM Kelurahan Lahendong." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232D5A4A'/><ellipse cx='16' cy='17' rx='8' ry='6' fill='none' stroke='%23F7F6F1' stroke-width='1.6'/><ellipse cx='16' cy='15.5' rx='3.5' ry='2.5' fill='%23F7F6F1'/></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-[var(--bg)] text-[var(--ink)] min-h-screen flex flex-col">

  <div id="header"></div>

  <main id="konten-utama" class="flex-1">

    <section class="bg-[var(--surface)] border-b border-[var(--line)]">
      <div class="max-w-[var(--konten)] mx-auto px-4 md:px-6 py-12 md:py-16 grid md:grid-cols-12 gap-6">
        <div class="md:col-span-7">
          <span class="eyebrow">Kelurahan Lahendong</span>
          <h1 class="judul-halaman mt-5">Galeri</h1>
        </div>
        <div class="md:col-span-5 md:self-end">
          <p class="text-[var(--muted)] leading-[1.65]">
            Kumpulan foto destinasi wisata dan usaha mikro warga Kelurahan Lahendong.
          </p>
        </div>
      </div>
    </section>

    <section class="max-w-[var(--konten)] mx-auto px-4 md:px-6 py-12 md:py-20">
      <div class="reveal flex flex-wrap items-center gap-2.5 mb-10 pb-6 border-b border-[var(--line)]">
        <span class="text-[11px] font-semibold tracking-[0.08em] uppercase text-[var(--muted)] mr-2">Saring</span>
        <button data-filter="semua" aria-pressed="true" class="tombol-filter">Semua</button>
        <button data-filter="wisata" aria-pressed="false" class="tombol-filter">Wisata</button>
        <button data-filter="umkm" aria-pressed="false" class="tombol-filter">UMKM</button>
        <span id="jumlah-foto" class="text-sm text-[var(--muted)] ml-auto"></span>
      </div>

      <div id="grid-galeri" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 md:gap-6">
        <!-- diisi oleh JS -->
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    const LABEL_KATEGORI = { wisata: "Wisata", umkm: "UMKM" };

    function kartuGaleri(item) {
      return `
        <figure data-kategori="${item.kategori}" class="kartu kartu-hover reveal overflow-hidden">
          <div class="bingkai-foto aspect-[4/3]">
            <img src="${urlFoto(item.foto)}" alt="${item.nama}" loading="lazy" onerror="this.src='img/placeholder.webp'" />
          </div>
          <figcaption class="p-5 flex items-start justify-between gap-4">
            <p class="font-judul text-[17px] leading-snug">${item.nama}</p>
            <span class="text-[11px] font-semibold tracking-[0.08em] uppercase text-[var(--muted)] whitespace-nowrap mt-1">
              ${LABEL_KATEGORI[item.kategori]}
            </span>
          </figcaption>
        </figure>
      `;
    }

    function terapkanFilter(kategori) {
      let terlihat = 0;
      document.querySelectorAll("#grid-galeri [data-kategori]").forEach((el) => {
        const cocok = kategori === "semua" || el.dataset.kategori === kategori;
        el.classList.toggle("hidden", !cocok);
        if (cocok) terlihat += 1;
      });
      document.querySelectorAll(".tombol-filter").forEach((btn) => {
        btn.setAttribute("aria-pressed", String(btn.dataset.filter === kategori));
      });
      const hitung = document.getElementById("jumlah-foto");
      if (hitung) hitung.textContent = terlihat + " foto";
    }

    async function muatGaleri() {
      const grid = document.getElementById("grid-galeri");
      tampilkanMemuat(grid);
      try {
        const [wisata, umkm] = await Promise.all([ambilData("wisata"), ambilData("umkm")]);
        const item = [
          ...wisata.map((row) => ({ nama: row.nama, foto: row.foto, kategori: "wisata" })),
          ...umkm.map((row) => ({ nama: row.nama, foto: row.foto, kategori: "umkm" })),
        ];
        if (!item.length) {
          tampilkanGagal(grid, "Belum ada foto untuk ditampilkan.");
          return;
        }
        grid.innerHTML = item.map(kartuGaleri).join("");
        terapkanFilter("semua");
        aktifkanReveal();
      } catch (err) {
        tampilkanGagal(grid, "Galeri belum bisa dimuat saat ini.");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      muatGaleri();
      document.querySelectorAll(".tombol-filter").forEach((btn) => {
        btn.addEventListener("click", () => terapkanFilter(btn.dataset.filter));
      });
      aktifkanReveal();
    });
  </script>
</body>
</html>
